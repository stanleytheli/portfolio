<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive graph</title>
</head>
<body>
<style>
:root{
  --bg:#0d1017; --panel:#161b24cc; --panel-solid:#141a23; --edge:#252d3a;
  --ink:#c3cad6; --ink-strong:#eef2f8; --muted:#7b8798; --accent:#5fd0c5;
  --grid:#2a3446;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#eef1f6; --panel:#ffffffdd; --panel-solid:#ffffff; --edge:#d5dbe6;
    --ink:#38414f; --ink-strong:#141a24; --muted:#66707f; --accent:#0f8b7e;
    --grid:#c8d0dd;
  }
}
:root[data-theme="light"]{
  --bg:#eef1f6; --panel:#ffffffdd; --panel-solid:#ffffff; --edge:#d5dbe6;
  --ink:#38414f; --ink-strong:#141a24; --muted:#66707f; --accent:#0f8b7e;
  --grid:#c8d0dd;
}
:root[data-theme="dark"]{
  --bg:#0d1017; --panel:#161b24cc; --panel-solid:#141a23; --edge:#252d3a;
  --ink:#c3cad6; --ink-strong:#eef2f8; --muted:#7b8798; --accent:#5fd0c5;
  --grid:#2a3446;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  line-height:1.5;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:30px 24px 56px}
header{margin-bottom:18px}
h1{font-size:22px;margin:0 0 6px;color:var(--ink-strong);font-weight:650;
  letter-spacing:-.01em;text-wrap:balance}
.sub{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:0}
.sub .accent{color:var(--accent)}
.stage{position:relative;width:100%;aspect-ratio:16/10;max-height:74vh;
  min-height:340px;border:1px solid var(--edge);border-radius:14px;
  overflow:hidden;
  background:radial-gradient(130% 120% at 50% 12%, var(--panel-solid), var(--bg));
  box-shadow:0 12px 44px #0000003d}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;
  touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
.overlay{position:absolute;background:var(--panel);backdrop-filter:blur(8px);
  border:1px solid var(--edge);border-radius:10px;pointer-events:none}
#legend{top:14px;right:14px;padding:10px 11px;display:flex;gap:9px;align-items:stretch}
#legbar{width:12px;border-radius:4px;
  background:linear-gradient(to top,#440154,#414487,#2a788e,#22a884,#7ad151,#fde725)}
#legend .ticks{display:flex;flex-direction:column;justify-content:space-between;
  font-family:var(--mono);font-size:10px;color:var(--muted)}
#legend .cap{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;
  color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
#readout{left:14px;bottom:14px;padding:10px 12px;font-family:var(--mono);
  font-size:12px;min-width:186px;line-height:1.55}
#readout .k{color:var(--muted)} #readout .v{color:var(--ink-strong)}
#readout .big{color:var(--accent);font-size:15px;font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;
  margin-top:16px;padding:12px 15px;background:var(--panel-solid);
  border:1px solid var(--edge);border-radius:12px}
.toolbar .grp{display:flex;align-items:center;gap:8px}
.toolbar label{font-size:12.5px;color:var(--ink)}
button{font-family:var(--sans);font-size:12.5px;color:var(--ink);
  background:transparent;border:1px solid var(--edge);border-radius:7px;
  padding:5px 11px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--accent);color:var(--ink-strong)}
button.on{background:var(--accent);border-color:var(--accent);color:#07130f;font-weight:600}
select{font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--panel-solid);
  border:1px solid var(--edge);border-radius:7px;padding:5px 26px 5px 10px;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select:hover{border-color:var(--accent)}
input[type=range]{width:104px;accent-color:var(--accent)}
.val{font-family:var(--mono);font-size:12px;color:var(--accent);min-width:22px}
.foot{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:15px 2px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="wrap">
  <header>
    <h1>Single-Pass Multiplication Landscape</h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="legend" class="overlay">
      <div class="cap">accuracy</div>
      <div id="legbar"></div>
      <div class="ticks"><span>100%</span><span>75%</span><span>50%</span><span>25%</span><span>0%</span></div>
    </div>
    <div id="readout" class="overlay"><span class="k">hover a cell&hellip;</span></div>
  </div>

  <div class="toolbar">
    <div class="grp" id="models"></div>
    <div class="grp"><label>Surface</label><button id="bSurf" class="on">on</button></div>
    <div class="grp"><label>Wireframe</label><button id="bWire" class="on">on</button></div>
    <div class="grp"><label>Auto-spin</label><button id="bSpin">off</button></div>
    <div class="grp"><label>Min&nbsp;samples</label>
      <input type="range" id="sMin" min="1" max="60" value="4">
      <span class="val" id="vMin">4</span></div>
    <div class="grp"><button id="bReset">Reset view</button></div>
  </div>

  <p class="foot">Drag to orbit &middot; scroll to zoom (Ctrl+scroll = browser zoom) &middot;
    height &amp; color = exact-match accuracy &middot; <span id="footaxes"></span></p>
</div>

<script>
(function(){
"use strict";
const stage=document.getElementById("stage");
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");

const AXX=DATA.axisx||"log₁₀ x", AXY=DATA.axisy||"log₁₀ y";
const BW=DATA.bw||1, MAXL=DATA.max_log;
let mi=0, cells=MODELS[mi].cells, M=MODELS[mi].meta;

function updateHeader(){
  document.getElementById("subtitle").innerHTML =
    M.model+" &middot; <span class='accent'>N="+(M.n||0).toLocaleString()+
    "</span> &middot; "+(MODE==="digits"
      ? "axes = digit count of 1st × 2nd operand (non-symmetric)"
      : "operands 1&ndash;"+(M.max_digits||"?")+" digits");
}
updateHeader();
document.getElementById("footaxes").textContent =
  (MODE==="digits" ? "axes = # digits of 1st (x) and 2nd (y) operand"
                   : "axes = log₁₀ of each operand");

// ---- theme-aware colors ----
let COL={};
function readTheme(){
  const cs=getComputedStyle(document.documentElement), g=k=>cs.getPropertyValue(k).trim();
  COL={bg:g("--bg"),grid:g("--grid"),ink:g("--ink"),muted:g("--muted"),edge:g("--edge")};
}
readTheme();
new MutationObserver(()=>{readTheme();draw();}).observe(
  document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{readTheme();draw();});

// ---- viridis ----
const VIR=[[68,1,84],[72,40,120],[62,74,137],[49,104,142],[38,130,142],
  [31,158,137],[53,183,121],[110,206,88],[181,222,43],[253,231,37]];
function viridis(t){t=Math.max(0,Math.min(1,t));const f=t*(VIR.length-1),i=Math.floor(f),r=f-i;
  const a=VIR[i],b=VIR[Math.min(i+1,VIR.length-1)];
  return "rgb("+Math.round(a[0]+(b[0]-a[0])*r)+","+Math.round(a[1]+(b[1]-a[1])*r)+","
    +Math.round(a[2]+(b[2]-a[2])*r)+")";}

// ---- view state ----
let yaw=-0.62, pitch=0.52, zoom=1, spin=false;
let showSurf=true, showWire=true, minN=4;
const DFT={yaw:-0.62,pitch:0.52,zoom:1};
const NX=MAXL, HEIGHT=1.35;
function norm(l){return (l/NX)*2-1;}

// ---- robust sizing: measure the STAGE (fixed by CSS), size backing store.
// Setting cv.width doesn't reflow the stage, so ResizeObserver won't loop. ----
let W=1,H=1,DPR=1;
function resize(){
  const r=stage.getBoundingClientRect();
  W=Math.max(1,Math.round(r.width)); H=Math.max(1,Math.round(r.height));
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function relayout(){resize();draw();}
window.addEventListener("resize",relayout);
if(window.ResizeObserver) new ResizeObserver(relayout).observe(stage);

function project(x,y,z){
  // center model about origin -> projects to canvas center
  let ca=Math.cos(yaw),sa=Math.sin(yaw);
  let x1=x*ca+z*sa, z1=-x*sa+z*ca, y1=y-HEIGHT*0.5;
  let cb=Math.cos(pitch),sb=Math.sin(pitch);

}

    ctx.lineWidth=1;
    for(const c of vis){
      const v=vpos(c),p=project(v.x,v.y,v.z);
      for(const nb of [map.get(key(c.ix+1,c.iy)),map.get(key(c.ix,c.iy+1))]){
        if(ok(nb)){const w=vpos(nb),q=project(w.x,w.y,w.z);
          ctx.strokeStyle=viridis((c.acc+nb.acc)/2);ctx.globalAlpha=.8;
          ctx.beginPath();ctx.moveTo(p.X,p.Y);ctx.lineTo(q.X,q.Y);ctx.stroke();}
      }
    }
    ctx.globalAlpha=1;
  }
  projCache=[];
  for(const c of vis){
    if(c.ip) continue;
    const v=vpos(c),p=project(v.x,v.y,v.z);
    projCache.push({c,X:p.X,Y:p.Y});
    ctx.beginPath(); ctx.arc(p.X,p.Y,2.1*p.f,0,7);
    ctx.fillStyle=viridis(c.acc); ctx.fill();
    ctx.lineWidth=.8; ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.stroke();
  }
}

function drawFloor(){
  ctx.lineWidth=1;
  for(let i=0;i<=NX;i++){
    const t=norm(i);
    let a=project(t,0,-1),b=project(t,0,1);
    ctx.strokeStyle=COL.grid;ctx.beginPath();ctx.moveTo(a.X,a.Y);ctx.lineTo(b.X,b.Y);ctx.stroke();
    let c=project(-1,0,t),d=project(1,0,t);
    ctx.beginPath();ctx.moveTo(c.X,c.Y);ctx.lineTo(d.X,d.Y);ctx.stroke();
  }
  ctx.fillStyle=COL.muted; ctx.font="11px ui-monospace,Consolas,monospace";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let i=0;i<=NX;i++){
    let p=project(norm(i),0,1.07); ctx.fillText(i,p.X,p.Y);
    let q=project(1.09,0,norm(i)); ctx.fillText(i,q.X,q.Y);
  }
  ctx.fillStyle=COL.ink; ctx.font="600 12px ui-monospace,Consolas,monospace";
  let lx=project(0,0,1.30); ctx.fillText(AXX,lx.X,lx.Y);
  let ly=project(1.32,0,0); ctx.fillText(AXY,ly.X,ly.Y);
  ctx.strokeStyle=COL.edge; ctx.setLineDash([3,4]);
  for(const a of [0.5,1.0]){const yy=a*HEIGHT;
    let p0=project(-1,yy,-1),p1=project(-1,yy,1),p2=project(1,yy,1);
    ctx.beginPath();ctx.moveTo(p0.X,p0.Y);ctx.lineTo(p1.X,p1.Y);ctx.lineTo(p2.X,p2.Y);ctx.stroke();}
  ctx.setLineDash([]);
  ctx.fillStyle=COL.muted; ctx.font="11px ui-monospace,Consolas,monospace"; ctx.textAlign="right";
  for(const a of [0,0.5,1.0]){let p=project(-1.07,a*HEIGHT,-1);ctx.fillText(Math.round(a*100)+"%",p.X,p.Y);}
  ctx.textAlign="center";
}

// ---- interaction ----
let drag=false,px=0,py=0;
cv.addEventListener("pointerdown",e=>{drag=true;px=e.clientX;py=e.clientY;
  cv.setPointerCapture(e.pointerId);spin=false;syncSpin();});
cv.addEventListener("pointermove",e=>{
  if(drag){yaw+=(e.clientX-px)*0.008;pitch+=(e.clientY-py)*0.006;
    pitch=Math.max(-0.15,Math.min(1.45,pitch));px=e.clientX;py=e.clientY;draw();}
  else hover(e);
});
cv.addEventListener("pointerup",()=>{drag=false;});
cv.addEventListener("pointerleave",()=>{if(!drag)
  document.getElementById("readout").innerHTML="<span class='k'>hover a cell&hellip;</span>";});
cv.addEventListener("wheel",e=>{
  if(e.ctrlKey) return;                 // let the browser do its own zoom
  e.preventDefault();
  zoom*=Math.exp(-e.deltaY*0.0011); zoom=Math.max(0.4,Math.min(4,zoom)); draw();
},{passive:false});

function hover(e){
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top; let best=null,bd=170;
  for(const p of projCache){const d=(p.X-mx)**2+(p.Y-my)**2; if(d<bd){bd=d;best=p;}}
  const el=document.getElementById("readout");
  if(best){const c=best.c;
    let head;
    if(MODE==="digits"){
      head="<div><span class='k'>x (1st):&nbsp;</span><span class='v'>"+c.cx+"-digit</span></div>"+
           "<div><span class='k'>y (2nd):&nbsp;</span><span class='v'>"+c.cy+"-digit</span></div>";
    } else {
      const dx=Math.floor(c.cx)+1,dy=Math.floor(c.cy)+1;
      head="<div><span class='k'>x&nbsp;&asymp;&nbsp;</span><span class='v'>10^"+c.cx.toFixed(2)+"</span> <span class='k'>("+dx+"-digit)</span></div>"+
           "<div><span class='k'>y&nbsp;&asymp;&nbsp;</span><span class='v'>10^"+c.cy.toFixed(2)+"</span> <span class='k'>("+dy+"-digit)</span></div>";
    }
    el.innerHTML="<div><span class='big'>"+(c.acc*100).toFixed(1)+"%</span> <span class='k'>accuracy</span></div>"+
      head+"<div><span class='k'>samples&nbsp;</span><span class='v'>"+c.n.toLocaleString()+"</span></div>";
  }
}

function tog(id,get,set){const b=document.getElementById(id);
  b.onclick=()=>{set(!get());b.classList.toggle("on",get());b.textContent=get()?"on":"off";draw();};}
tog("bSurf",()=>showSurf,v=>showSurf=v);
tog("bWire",()=>showWire,v=>showWire=v);
const bSpin=document.getElementById("bSpin");
function syncSpin(){bSpin.classList.toggle("on",spin);bSpin.textContent=spin?"on":"off";}
bSpin.onclick=()=>{spin=!spin;syncSpin();if(spin)loop();};
document.getElementById("sMin").oninput=e=>{minN=+e.target.value;
  document.getElementById("vMin").textContent=minN;draw();};
document.getElementById("bReset").onclick=()=>{yaw=DFT.yaw;pitch=DFT.pitch;zoom=DFT.zoom;draw();};

// ---- model selector dropdown (only shown when >1 model) ----
function setModel(i){mi=i; cells=MODELS[i].cells; M=MODELS[i].meta; rebuildMap();
  updateHeader(); const s=document.getElementById("modelSel"); if(s)s.value=i; draw();}
if(MODELS.length>1){
  const box=document.getElementById("models");
  const lab=document.createElement("label"); lab.setAttribute("for","modelSel");
  lab.textContent="Model"; box.appendChild(lab);
  const sel=document.createElement("select"); sel.id="modelSel";
  MODELS.forEach((m,i)=>{const o=document.createElement("option");
    o.value=i; o.textContent=m.label; sel.appendChild(o);});
  sel.onchange=()=>setModel(+sel.value); box.appendChild(sel);
}

const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function loop(){if(!spin)return; yaw+=0.004; draw(); if(!reduce)requestAnimationFrame(loop);}

resize(); draw();
})();
</script>
